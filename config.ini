# Battery Payback Period Calculator - Configuration File
# All monetary values in Euros (€)
# All energy values in kWh
# All power values kW

[Simulation]
# Number of years to simulate
years = 15

[Tariff]
# Tariff type: 'static' or 'dynamic'
type = dynamic

# shared variables between static and dynamic
# Rates in €/kWh

transport_rate = 0.022
energy_tax = 0.03868

# Annual price increases (%)
transport_rate_increase_percent = 2.0
energy_tax_increase_percent = 2.0

[TariffStatic]
# Cost consumption: day/night rate + transport rate + energy tax
# Revenue export: export_rate

day_rate = 0.13
night_rate = 0.12

# Day/night rate schedule (24-hour format)
day_start_hour = 7
day_end_hour = 23

export_rate = 0.035

# Annual price increases (%) for static tariff components
day_rate_increase_percent = 2.0
night_rate_increase_percent = 2.0
export_rate_increase_percent = 2.0

[TariffDynamic]
# Cost consuming: EPEX rate + transport rate + energy tax + trader fee
# Revenue export: EPEX rate - export fee - trader fee

trader_fee = 0.02
export_fee = 0.03
epex_price_increase_percent = 2.5

# EPEX data configuration
epex_country = Netherlands
epex_start_date = 2023-11-01
epex_stop_date = 2025-11-01


[Consumption]
# Annual energy usage in kWh (assumed constant hourly distribution)
yearly_energy_usage_kwh = 283000

# --- Profile Variation ---
# Percentage variation for daily and seasonal consumption patterns.
# A value of 10 for daily means consumption varies by approx. +/- 5% around the daily mean.
# A value of 20 for seasonal means consumption varies by approx. +/- 10% between summer and winter.
daily_variation_percent = 10.0
seasonal_variation_percent = 20.0

# Hour when daytime consumption rates begin (for daily variation modeling)
day_start_hour = 9
# Hour when daytime consumption rates end (for daily variation modeling)
day_end_hour = 17

[Solar]
# Annual PV generation in first year (kWh)
yearly_generation_kwh = 283000

# Annual degradation rate (%)
degradation_rate_percent = 0.8

# --- Overcast Simulation ---
# Enable/disable overcast simulation for more realistic solar generation.
# When enabled, the model simulates cloudy periods based on weather data from The Netherlands
# The total yearly generation will still match 'yearly_generation_kwh'.
# Set to True / False
overcast_enabled = True

[Battery]
# Usable battery capacity (kWh)
capacity_kwh = 460

# Maximum charge/discharge power (kW)
max_power_kw = 160

# Energy losses (%)
charge_loss_percent = 8.0
discharge_loss_percent = 8.0

# Number of full equivalent cycles to 80% capacity retention (the battery degradation)
cycles_to_80_percent = 6000

# Annual calendar degradation rate (%)
calendar_degradation_rate_percent = 1.0

# Total investment cost (€)
investment_euros = 150000