# Battery Payback Period Calculator - Configuration File
# All monetary values in Euros (€)
# All energy values in kWh or kW as specified

[Simulation]
# Number of years to simulate
years = 15

[Tariff]
# Tariff type: 'static' or 'dynamic' (dynamic not yet implemented)
