# Battery Payback Period Calculator - Configuration File
# All monetary values in Euros (€)
# All energy values in kWh or kW as specified

[Simulation]
# Number of years to simulate
years = 15

[Tariff]
# Tariff type: 'static' or 'dynamic'
type = dynamic

# Static tariff rates (€/kWh)
# These are typical Dutch rates for 2024
day_rate = 0.13
night_rate = 0.12
transport_rate = 0.022
energy_tax = 0.03868

# rate that we receive when delivering back energy. the energy tax, transport don't have to be added/substracted.
feed_back_rate = 0.035

# Day/night rate schedule (24-hour format)
day_start_hour = 7
day_end_hour = 23

# Expected annual price increases (%)
day_rate_increase_percent = 2.0
night_rate_increase_percent = 2.0
transport_rate_increase_percent = 2.0
energy_tax_increase_percent = 2
feed_back_rate_increase_percent = 2.0

[Consumption]
# Annual energy usage in kWh (assumed constant hourly distribution)
yearly_energy_usage_kwh = 283000

[Solar]
# Annual PV generation in first year (kWh)
yearly_generation_kwh = 283000

# Annual degradation rate (%)
degradation_rate_percent = 0.5

[Battery]
# Usable battery capacity (kWh)
capacity_kwh = 450

# Energy losses (%)
charge_loss_percent = 7.0
discharge_loss_percent = 7.0

# Number of full equivalent cycles to 80% capacity retention
cycles_to_80_percent = 6000

# Annual calendar degradation rate (%)
calendar_degradation_rate_percent = 1.0

# Total investment cost (€)
investment_euros = 150000
max_power_kw = 160

[DynamicTariff]
# These settings are used if tariff type is 'dynamic'
trader_fee = 0.02
feed_in_fee = 0.03
epex_price_increase_percent = 2.5