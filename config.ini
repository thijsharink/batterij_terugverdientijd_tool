# Battery Payback Period Calculator - Configuration File
# All monetary values in Euros (€)
# All energy values in kWh or kW as specified

[Simulation]
# Number of years to simulate
years = 15

[Tariff]
# Tariff type: 'static' or 'dynamic' (dynamic not yet implemented)
type = static

# Static tariff rates (€/kWh)
# These are typical Dutch rates for 2024
day_rate = 0.25
night_rate = 0.18
transport_rate = 0.11
energy_tax = 0.12

# Day/night rate schedule (24-hour format)
day_start_hour = 7
day_end_hour = 23

# Expected annual price increases (%)
day_rate_increase_percent = 3.0
night_rate_increase_percent = 3.0
transport_rate_increase_percent = 2.0
energy_tax_increase_percent = 1.5

[Consumption]
# Constant base load in kW
# Example: 50 kW = 50 * 24 * 365 = 438,000 kWh/year
constant_load_kw = 50.0

[Solar]
# Annual PV generation in first year (kWh)
yearly_generation_kwh = 600000

# Annual degradation rate (%)
degradation_rate_percent = 0.5

# Optional: Path to CSV file with 24 hourly generation values (0-1 scale, must sum to 1)
# Leave empty to use default solar curve
# Format: one value per line, 24 lines total
profile_csv = 

[Battery]
# Usable battery capacity (kWh)
capacity_kwh = 520

# Energy losses (%)
charge_loss_percent = 7
discharge_loss_percent = 7

# Annual capacity degradation (%)
degradation_rate_percent = 1.5

# Total investment cost (€)
investment_euros = 200000